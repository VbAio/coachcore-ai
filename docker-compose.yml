version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coachcore
      POSTGRES_PASSWORD: coachcore
      POSTGRES_DB: coachcore
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://coachcore:coachcore@postgres:5432/coachcore?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      AI_COACH_PROVIDER: mock
    depends_on:
      - postgres
      - redis
    volumes:
      - replay_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  replay_uploads:
